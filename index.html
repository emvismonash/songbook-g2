<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Song Book</title>
  </head>
  <body>
    <main>
      <h1>Songbook</h1>
      <p id="status">Starting...</p>

      <div id="controls">
        <button id="import-btn">Import</button>
        <input type="file" id="file-input" accept=".txt" style="display: none" />
      </div>

      <section id="page-index" aria-labelledby="page-index-label">
        <h2 id="page-index-label">Page index</h2>
        <ul id="page-list"></ul>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
